openapi: 3.0.3
info:
  title: Azure Cloud Resume Visitor Counter API
  version: 1.1.0
  description: |
    Canonical Phase 4 contract for the public visitor counter.
    The approved visitor operation is GET /api/visitors.
servers:
  - url: https://api.example.invalid
    description: Documentation placeholder; production hostname is deployment configuration.
paths:
  /api/visitors:
    get:
      operationId: getVisitorCount
      summary: Perform the approved visitor-count operation
      description: |
        Performs one visitor-counter operation for a top-level resume page load
        and returns the resulting persisted count. The operation is intentionally
        non-idempotent.
      tags:
        - Visitor Counter
      parameters:
        - name: X-Request-ID
          in: header
          required: false
          description: Optional UUID v4 correlation identifier.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Counter operation committed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitorCountResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Platform/runtime rate limiting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected or internal failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Required dependency unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Required dependency timed out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: []
      x-requirements:
        - REQ-AZ-007
        - REQ-AZ-008
        - REQ-AZ-009
        - REQ-AZ-010
        - REQ-AZ-SEC-002
        - REQ-AZ-SEC-003
      x-architecture:
        - ADR-002
        - ADR-003
        - ADR-005
        - ADR-007
components:
  schemas:
    VisitorCountResponse:
      type: object
      additionalProperties: false
      required:
        - count
      properties:
        count:
          type: integer
          minimum: 0
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - requestId
          properties:
            code:
              type: string
              pattern: '^[A-Z][A-Z0-9_]{2,63}$'
            message:
              type: string
              minLength: 1
              maxLength: 256
            requestId:
              type: string
              format: uuid
            details:
              type: object
              additionalProperties: false
              properties:
                timestamp:
                  type: string
                  format: date-time
x-security:
  browserToCosmos: prohibited
  productionCorsOrigin: final-approved-resume-origin
  endUserAuthentication: none
  credentialsInBrowser: prohibited