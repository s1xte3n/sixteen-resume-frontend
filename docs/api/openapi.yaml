openapi: 3.0.3
info:
  title: Azure Cloud Resume Visitor Counter API
  version: 1.0.0
  description: |
    Canonical v1 interface contract for the public visitor counter.
    The exact definition of a visitor and increment semantics remains blocked
    by OR-001 and must not be invented by an implementation.
servers:
  - url: https://api.example.invalid
    description: Documentation placeholder; production origin is not yet frozen.
paths:
  /api/v1/visitor-count:
    post:
      operationId: performVisitorCount
      summary: Perform the approved visitor-count operation
      description: |
        Performs the approved counter operation and returns the resulting
        persisted count. The exact visitor-count semantics are pending OR-001.
      tags:
        - Visitor Counter
      parameters:
        - name: X-Request-ID
          in: header
          required: false
          description: Optional UUID v4 correlation ID.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitorCountRequest'
      responses:
        '200':
          description: Counter operation succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitorCountResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Unsupported media type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Required dependency unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Required dependency timed out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: []
      x-requirements:
        - REQ-AZ-007
        - REQ-AZ-008
        - REQ-AZ-009
        - REQ-AZ-010
components:
  schemas:
    VisitorCountRequest:
      type: object
      additionalProperties: false
      maxProperties: 0
      description: Empty request object.
    VisitorCountResponse:
      type: object
      additionalProperties: false
      required:
        - count
      properties:
        count:
          type: integer
          minimum: 0
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - requestId
          properties:
            code:
              type: string
              pattern: '^[A-Z][A-Z0-9_]{2,63}$'
            message:
              type: string
              minLength: 1
              maxLength: 256
            requestId:
              type: string
              format: uuid
            details:
              type: object
              additionalProperties: false
              properties:
                timestamp:
                  type: string
                  format: date-time
x-security:
  browserToCosmos: prohibited
  productionCorsOrigin: final-resume-origin-required
