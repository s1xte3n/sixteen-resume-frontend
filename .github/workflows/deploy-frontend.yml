name: Deploy frontend to Azure Storage

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy static resume
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.PUBLIC_HOSTNAME }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment configuration and static artifacts
        shell: bash
        env:
          AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}
          PUBLIC_HOSTNAME: ${{ vars.PUBLIC_HOSTNAME }}
        run: |
          set -euo pipefail

          if [[ -z "${AZURE_STORAGE_ACCOUNT_NAME}" ]]; then
            echo "::error::Missing production environment variable: AZURE_STORAGE_ACCOUNT_NAME"
            exit 1
          fi

          if [[ -z "${PUBLIC_HOSTNAME}" ]]; then
            echo "::error::Missing production environment variable: PUBLIC_HOSTNAME"
            exit 1
          fi

          if [[ ! "${PUBLIC_HOSTNAME}" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error::PUBLIC_HOSTNAME is not a valid hostname"
            exit 1
          fi

          for required in site/index.html site/style.css site/script.js; do
            if [[ ! -f "${required}" ]]; then
              echo "::error::Required frontend artifact missing: ${required}"
              exit 1
            fi
          done

          if find site -type f \( -name '*.pem' -o -name '*.key' -o -name '.env' -o -name '.env.*' \) -print -quit | grep -q .; then
            echo "::error::Potential credential-bearing file found in site/. Remove it before deployment."
            exit 1
          fi

          if grep -RniE 'AccountKey=|DefaultEndpointsProtocol=|SharedAccessSignature=|client_secret|AZURE_CLIENT_SECRET|COSMOS_CONNECTION_STRING' site; then
            echo "::error::Potential Azure/database credential material found in frontend artifacts."
            exit 1
          fi

      - name: Build production static website
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist evidence
          mkdir -p dist evidence
          cp -a site/. dist/
          test -f dist/index.html
          test -f dist/style.css
          test -f dist/script.js

          find dist -type f -printf '%P\n' | sort > evidence/dist-manifest.txt
          sha256sum $(find dist -type f -print | sort) > evidence/dist-sha256.txt
          printf 'commit_sha=%s\n' "${GITHUB_SHA}" > evidence/build-metadata.txt

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: false

      - name: Upload production build using Microsoft Entra authorization
        shell: bash
        env:
          AZURE_CORE_OUTPUT: none
          AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}
        run: |
          set -euo pipefail

          az storage blob upload-batch \
            --account-name "${AZURE_STORAGE_ACCOUNT_NAME}" \
            --destination '$web' \
            --source dist \
            --auth-mode login \
            --overwrite

          printf 'deployment_result=storage_upload_succeeded\ncommit_sha=%s\n' "${GITHUB_SHA}" > evidence/deployment-result.txt

      - name: Verify Azure Storage static website endpoint
        shell: bash
        env:
          AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail

          STORAGE_WEB_ENDPOINT="$(
            az storage account show               --resource-group "${AZURE_RESOURCE_GROUP}"               --name "${AZURE_STORAGE_ACCOUNT_NAME}"               --query "primaryEndpoints.web"               --output tsv
          )"

          if [[ -z "${STORAGE_WEB_ENDPOINT}" ]]; then
            echo "::error::Azure Storage static website endpoint is not configured."
            exit 1
          fi

          for attempt in {1..6}; do
            if curl --fail --silent --show-error --location \
              --proto '=https' \
              --proto-redir '=https' \
              --max-time 20 \
              --retry 3 \
              --retry-delay 5 \
              --retry-all-errors \
              "${STORAGE_WEB_ENDPOINT}" \
              > /tmp/storage-resume.html; then
              break
            fi
            echo "Static website endpoint not reachable yet (${attempt}/6): ${STORAGE_WEB_ENDPOINT}"
            sleep 10
          done

          grep -qi '<html' /tmp/storage-resume.html
          printf 'storage_web_endpoint=%s\nstorage_verification=passed\n' "${STORAGE_WEB_ENDPOINT}" >> evidence/deployment-result.txt

      - name: Verify public HTTPS endpoint when edge is provisioned
        if: ${{ vars.VERIFY_PUBLIC_ENDPOINT == 'true' }}
        shell: bash
        env:
          PUBLIC_HOSTNAME: ${{ vars.PUBLIC_HOSTNAME }}
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location             --proto '=https'             --proto-redir '=https'             --max-time 20             "https://${PUBLIC_HOSTNAME}/"             > /tmp/public-resume.html

          grep -qi '<html' /tmp/public-resume.html
          printf 'public_endpoint=https://%s/\npublic_verification=passed\n' "${PUBLIC_HOSTNAME}" >> evidence/deployment-result.txt

      - name: Record public HTTPS verification as pending when edge is not provisioned
        if: ${{ vars.VERIFY_PUBLIC_ENDPOINT != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'public_endpoint=https://${{ vars.PUBLIC_HOSTNAME }}/\npublic_verification=pending-edge-and-dns\n' >> evidence/deployment-result.txt

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-deployment-evidence-${{ github.sha }}
          path: evidence/
          retention-days: 30

      - name: Azure logout
        if: always()
        shell: bash
        run: az logout
