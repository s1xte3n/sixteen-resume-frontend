name: Verify Azure OIDC

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-oidc-verification
  cancel-in-progress: true

jobs:
  verify-oidc:
    name: Verify GitHub → Azure OIDC
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required GitHub configuration
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [[ -z "${!name}" ]]; then echo "::error::Missing GitHub production environment variable: $name"; exit 1; fi
          done

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: false

      - name: Verify Azure subscription context
        shell: bash
        run: az account show --query '{subscriptionId:id,tenantId:tenantId,isDefault:isDefault}' --output json

      - name: Validate required production environment variables
        shell: bash
        env:
          AZURE_RESOURCE_GROUP_NAME: ${{ vars.AZURE_RESOURCE_GROUP_NAME }}
          AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}
          AZURE_FRONTEND_IDENTITY_NAME: ${{ vars.AZURE_FRONTEND_IDENTITY_NAME }}
          AZURE_FRONTEND_IDENTITY_RESOURCE_GROUP: ${{ vars.AZURE_FRONTEND_IDENTITY_RESOURCE_GROUP }}
          VERIFY_PUBLIC_ENDPOINT: ${{ vars.VERIFY_PUBLIC_ENDPOINT }}
          PUBLIC_HOSTNAME: ${{ vars.PUBLIC_HOSTNAME }}
        run: |
          set -euo pipefail
          for name in AZURE_RESOURCE_GROUP_NAME AZURE_STORAGE_ACCOUNT_NAME AZURE_FRONTEND_IDENTITY_NAME AZURE_FRONTEND_IDENTITY_RESOURCE_GROUP VERIFY_PUBLIC_ENDPOINT; do
            if [[ -z "${!name}" ]]; then echo "::error::Missing GitHub production environment variable: $name"; exit 1; fi
          done
          if [[ "${VERIFY_PUBLIC_ENDPOINT}" == "true" && -z "${PUBLIC_HOSTNAME}" ]]; then
            echo "::error::PUBLIC_HOSTNAME is required when VERIFY_PUBLIC_ENDPOINT=true"
            exit 1
          fi

      - name: Verify storage deployment scope
        shell: bash
        env:
          AZURE_RESOURCE_GROUP_NAME: ${{ vars.AZURE_RESOURCE_GROUP_NAME }}
          AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}
        run: |
          set -euo pipefail
          storage_json="$(az storage account show --name "${AZURE_STORAGE_ACCOUNT_NAME}" --resource-group "${AZURE_RESOURCE_GROUP_NAME}" --output json)"
          actual_rg="$(jq -r '.resourceGroup' <<<"${storage_json}")"
          actual_name="$(jq -r '.name' <<<"${storage_json}")"
          [[ "${actual_rg}" == "${AZURE_RESOURCE_GROUP_NAME}" ]] || { echo "::error::Storage resource group mismatch"; exit 1; }
          [[ "${actual_name}" == "${AZURE_STORAGE_ACCOUNT_NAME}" ]] || { echo "::error::Storage account mismatch"; exit 1; }

      - name: Verify frontend OIDC identity and federated credential
        shell: bash
        env:
          AZURE_FRONTEND_IDENTITY_NAME: ${{ vars.AZURE_FRONTEND_IDENTITY_NAME }}
          AZURE_FRONTEND_IDENTITY_RESOURCE_GROUP: ${{ vars.AZURE_FRONTEND_IDENTITY_RESOURCE_GROUP }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          identity_client_id="$(az identity show --name "${AZURE_FRONTEND_IDENTITY_NAME}" --resource-group "${AZURE_FRONTEND_IDENTITY_RESOURCE_GROUP}" --query clientId -o tsv)"
          [[ "${identity_client_id}" == "${AZURE_CLIENT_ID}" ]] || { echo "::error::AZURE_CLIENT_ID does not match the frontend managed identity."; exit 1; }
          expected_subject="repo:${GITHUB_REPOSITORY_OWNER}/${GITHUB_REPOSITORY_NAME}:environment:production"
          credentials_json="$(az identity federated-credential list --name "${AZURE_FRONTEND_IDENTITY_NAME}" --resource-group "${AZURE_FRONTEND_IDENTITY_RESOURCE_GROUP}" --output json)"
          match_count="$(jq --arg subject "${expected_subject}" '[.[] | select(.issuer == "https://token.actions.githubusercontent.com" and .subject == $subject and (.audiences | index("api://AzureADTokenExchange")))] | length' <<<"${credentials_json}")"
          [[ "${match_count}" -eq 1 ]] || { echo "::error::Expected exactly one matching GitHub Actions federated credential."; exit 1; }

      - name: Verify Blob data-plane access without storage keys
        shell: bash
        env:
          AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}
        run: |
          set -euo pipefail
          az storage blob list --account-name "${AZURE_STORAGE_ACCOUNT_NAME}" --container-name '$web' --auth-mode login --num-results 1 --output none

      - name: Verify public hostname when edge verification is enabled
        if: ${{ vars.VERIFY_PUBLIC_ENDPOINT == 'true' }}
        shell: bash
        env:
          PUBLIC_HOSTNAME: ${{ vars.PUBLIC_HOSTNAME }}
        run: |
          set -euo pipefail
          [[ "${PUBLIC_HOSTNAME}" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "::error::PUBLIC_HOSTNAME is not a valid hostname"; exit 1; }
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 20 "https://${PUBLIC_HOSTNAME}/" > /tmp/production.html
          grep -qi '<html' /tmp/production.html

      - name: Azure logout
        if: always()
        run: az logout
